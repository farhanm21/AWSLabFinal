server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /auth/ {
        proxy_pass http://auth-service:3001;
        proxy_set_header Host $host;
    }

    location /events {
        proxy_pass http://event-service:3002;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
