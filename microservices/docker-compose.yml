version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: farhan_u166
      RABBITMQ_DEFAULT_PASS: secret
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://admin:secret@postgres:5432/authdb
      JWT_SECRET: supersecretjwtkey_changeme
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    build: ./event-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://admin:secret@postgres:5432/authdb
      JWT_SECRET: supersecretjwtkey_changeme
      RABBITMQ_URL: amqp://farhan_u166:secret@rabbitmq:5672
    volumes:
      - ./event-log:/app/event-log
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    environment:
      RABBITMQ_URL: amqp://farhan_u166:secret@rabbitmq:5672
    volumes:
      - ./event-log:/app/event-log
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - event-service

volumes:
  postgres_data:
